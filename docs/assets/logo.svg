<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" width="40" height="32"
     role="img" aria-label="FiberQ ქართულად">
  <title>ერთი ბოჭკო სამად იტოტება: მაგისტრალი, განაწილება, აბონენტი</title>
  <!-- Material-ის header-ში ლოგო <img>-ია და CSS-ით არ იფერადება, ამიტომ
       შტრიხები თეთრია — teal header-ზე ორივე თემაში იკითხება.
       კვანძი ნარინჯისფერია: იგივე ფერი, რაც ფავიკონის ბირთვს — ორი ნიშანი
       ასე ერთ სისტემად იკვრება. -->
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
    <!-- შემომავალი მაგისტრალი -->
    <path d="M2 16 H11.6"/>
    <!-- სამი განშტოება; ბოჭკო იხრება, სწორ ხაზად არ მიდის -->
    <path d="M17.3 14.4 Q25.5 11.6 31.4 7.4"/>
    <path d="M18 16 H33.4"/>
    <path d="M17.3 17.6 Q25.5 20.4 31.4 24.6"/>
  </g>
  <!-- დაბოლოებები -->
  <circle cx="33.2" cy="6.2" r="2.2" fill="#fff"/>
  <circle cx="35.8" cy="16" r="2.2" fill="#fff"/>
  <circle cx="33.2" cy="25.8" r="2.2" fill="#fff"/>
  <!-- კვანძი: სადაც ბოჭკოები ერწყმის -->
  <circle cx="14" cy="16" r="4" fill="#fff"/>
  <circle cx="14" cy="16" r="2.4" fill="#ff6e40"/>
</svg>
